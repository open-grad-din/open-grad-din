<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8">
<!-- 主要內容全部放在中間 600px：WhatsApp 等會把圖裁成正方形縮圖，兩側只放裝飾。 -->
<style>
@font-face{font-family:H;src:url(font/huninn-sub.woff2)}
:root{--paper:#f8f4ec;--surface:#fffdf9;--ink:#3a3632;--muted:#76706a;--line:#e6ddd0;--stroke:#cdbfae;--ai:#5e7f9b;--shu:#c8603f;--shu-soft:#f0c9b8;--kin:#d7a53d;--kin-soft:#f5e3b8;--sage:#86a48a;
--tape:repeating-linear-gradient(135deg,rgba(215,165,61,.6) 0 8px,rgba(215,165,61,.38) 8px 16px)}
html,body{margin:0}
body{width:1200px;height:630px;background:var(--paper);font-family:H;color:var(--ink);position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center}
.kids{width:600px;height:auto;margin-top:40px;overflow:visible}
.kids .ln{fill:none;stroke:var(--ink);stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
.kids .fl,.kids .eye{fill:var(--ink)}.kids path[d*="q5 5 10 0"]{stroke-width:2.6}.kids .cheek{fill:var(--shu-soft)}
.kids .c1{fill:var(--kin)}.kids .c2{fill:var(--ai)}.kids .c3{fill:var(--sage)}
.kids [style*="opacity:.35"]{opacity:.55!important}
h1{font-size:140px;line-height:1;margin:6px 0 0;letter-spacing:.04em;font-weight:400;-webkit-text-stroke:3px var(--ink)}
.mark{background:linear-gradient(transparent 58%,var(--kin-soft) 58% 94%,transparent 94%);padding:0 .06em}
.date{position:relative;margin-top:30px;font-size:56px;line-height:1;padding:14px 36px;color:var(--shu);-webkit-text-stroke:1.2px var(--shu);background:var(--surface);border:4px solid var(--stroke);border-radius:22px 18px 24px 16px/18px 24px 16px 22px;transform:rotate(-2deg);box-shadow:6px 6px 0 var(--line)}
.date::before{content:"";position:absolute;top:-18px;left:50%;width:130px;height:32px;transform:translateX(-50%) rotate(3deg);background:var(--tape);border-radius:3px}
.deco{position:absolute;inset:0}
.deco .star{fill:none;stroke:var(--kin);stroke-width:7;stroke-linecap:round}
.deco .dot{opacity:.7}
</style></head><body>
