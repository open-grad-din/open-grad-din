<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8">
<style>
@font-face{font-family:H;src:url(font/huninn-sub.woff2)}
:root{--paper:#f8f4ec;--surface:#fffdf9;--ink:#3a3632;--muted:#76706a;--line:#e6ddd0;--stroke:#cdbfae;--ai:#5e7f9b;--shu:#c8603f;--shu-soft:#f6e3da;--kin:#d7a53d;--kin-soft:#f7ecd3;--sage:#86a48a;
--tape:repeating-linear-gradient(135deg,rgba(215,165,61,.55) 0 6px,rgba(215,165,61,.35) 6px 12px)}
html,body{margin:0}
body{width:1200px;height:630px;background:var(--paper);font-family:H;color:var(--ink);position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center}
.frame{position:absolute;inset:22px;border:3px solid var(--stroke);border-radius:46px 38px 50px 34px/38px 50px 34px 46px}
.kids{width:560px;height:auto;margin-top:46px;overflow:visible}
.kids .ln{fill:none;stroke:var(--ink);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.kids .fl,.kids .eye{fill:var(--ink)}.kids .cheek{fill:var(--shu-soft)}
.kids .c1{fill:var(--kin)}.kids .c2{fill:var(--ai)}.kids .c3{fill:var(--sage)}
.kids .star{fill:none;stroke:var(--kin);stroke-width:2.5;stroke-linecap:round}
.eyebrow{font-size:30px;color:var(--muted);letter-spacing:.18em;margin-top:6px}
h1{font-size:118px;line-height:1.1;margin:4px 0 0;letter-spacing:.14em;font-weight:400;-webkit-text-stroke:2px var(--ink)}
.mark{background:linear-gradient(transparent 60%,var(--kin-soft) 60% 92%,transparent 92%);padding:0 .02em 0 .16em}
.date{position:relative;margin-top:26px;font-size:36px;padding:10px 34px;background:var(--surface);border:3px solid var(--stroke);border-radius:22px 18px 24px 16px/18px 24px 16px 22px;transform:rotate(-1.5deg);box-shadow:5px 5px 0 var(--line)}
.date::before{content:"";position:absolute;top:-16px;left:50%;width:120px;height:28px;transform:translateX(-50%) rotate(3deg);background:var(--tape);border-radius:3px}
.date b{color:var(--shu);font-weight:400}
</style></head><body>
