name: 部署到 GitHub Pages

# 只在 main 有新合併時部署。main 受保護，所有改動必須經 Pull Request。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # 把這次部署的 commit 編號寫進頁底，家長可以點擊查看該版本的原始碼。
      # 同一編號亦加在 CSS 及 JS 連結後，令瀏覽器每次部署都載入新版，不會用舊的快取。
      - name: 寫入 commit 編號
        run: |
          sed -i "s/__COMMIT_SHORT__/${GITHUB_SHA:0:7}/g; s/__COMMIT__/${GITHUB_SHA}/g" site/*.html
          for f in site/*.html; do grep -q "${GITHUB_SHA}" "$f"; done

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
